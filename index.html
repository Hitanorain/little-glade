<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="小小林间：仿 Tiny Glade 风格的浮岛建造小游戏。拖拽画城墙、盖房子、铺小路、涂水域、种北美树种，切换天气和四季。">
<title>小小林间</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
  /* 布局：整屏 3D 微缩景观，纸质卡片浮在四角，底部是工具栏。单一的晴日纸张配色，不随系统深色切换。 */
  :root {
    --paper: #f7f1e3;
    --paper-glass: rgba(248, 243, 230, 0.86);
    --ink: #463c33;
    --ink-soft: #7c6f61;
    --line: #dccfb5;
    --slate: #5f72a3;
    --slate-ink: #fbf7ee;
    --sky: #cfdcef;
    --font-display: "ZCOOL XiaoWei", "STKaiti", "KaiTi", serif;
    --font-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--sky); color: var(--ink);
    font-family: var(--font-body); -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; inset: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  /* 移轴模糊 + 暗角，让场景更像桌上的微缩模型 */
  .tilt { position: absolute; left: 0; right: 0; pointer-events: none; backdrop-filter: blur(2.2px); -webkit-backdrop-filter: blur(2.2px); }
  .tilt.top { top: 0; height: 22%; mask-image: linear-gradient(to bottom, #000, transparent); -webkit-mask-image: linear-gradient(to bottom, #000, transparent); }
  .tilt.bottom { bottom: 0; height: 16%; mask-image: linear-gradient(to top, #000, transparent); -webkit-mask-image: linear-gradient(to top, #000, transparent); }
  .sunglow {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0;
    background: radial-gradient(circle at var(--sx, 20%) var(--sy, 10%), rgba(255, 222, 168, 0.32), rgba(255, 205, 150, 0.08) 30%, transparent 62%);
  }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 55%, rgba(70, 55, 95, 0.22) 100%); }

  .card {
    background: var(--paper-glass); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 6px 24px rgba(70, 52, 30, 0.12), 0 1px 0 rgba(255, 255, 255, 0.7) inset;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .title {
    position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    padding: 12px 18px 12px; max-width: min(320px, calc(100vw - 32px));
  }
  .title h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: 0.08em; line-height: 1.1; }
  .title p { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; text-wrap: balance; }

  .side {
    position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    padding: 12px 14px; width: 230px; display: flex; flex-direction: column; gap: 10px;
  }
  .side .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .side .lab b { font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--slate); }
  input[type=range] { width: 100%; accent-color: var(--slate); margin: 0; }
  .btnrow { display: flex; gap: 6px; }
  .btn {
    flex: 1; font: inherit; font-size: 13px; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; cursor: pointer;
  }
  .btn:hover { background: #fffaf0; }
  .btn.warn { background: #f3d9cc; border-color: #d9a993; }
  .btn:focus-visible, .tool:focus-visible, .chip:focus-visible, .sw:focus-visible { outline: 2px solid var(--slate); outline-offset: 2px; }

  .dock {
    position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .options {
    padding: 8px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    max-width: min(720px, 100%); font-size: 13px; color: var(--ink-soft);
  }
  .options .hint { min-width: 0; line-height: 1.5; }
  .options .grp { display: flex; align-items: center; gap: 6px; color: var(--ink); }
  .chip {
    font: inherit; font-size: 12.5px; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; cursor: pointer;
  }
  .chip.on { background: var(--slate); color: var(--slate-ink); border-color: var(--slate); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips .chip { flex: 1 1 0; min-width: 0; text-align: center; padding: 3px 4px; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  .sw.on { box-shadow: 0 0 0 2px var(--ink); }
  .tools {
    display: flex; gap: 4px; padding: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: none;
  }
  .tools::-webkit-scrollbar { display: none; }
  .tool {
    flex: 0 0 auto; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font: inherit; font-size: 12.5px; color: var(--ink); background: transparent; border: 0; border-radius: 12px;
    padding: 7px 2px 6px; cursor: pointer; position: relative;
  }
  .tool svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tool:hover { background: rgba(95, 114, 163, 0.1); }
  .tool.on { background: var(--slate); color: var(--slate-ink); }
  .tool kbd { position: absolute; top: 3px; right: 6px; font: 10px var(--font-body); opacity: 0.45; }
  .help {
    position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    font-size: 12px; line-height: 1.7; color: #4b4458; text-shadow: 0 1px 0 rgba(255,255,255,0.6); max-width: 190px;
  }
  .toast {
    position: absolute; left: 50%; top: calc(22px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px);
    padding: 7px 16px; font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center; background: var(--sky);
    font-family: var(--font-display); font-size: 22px; letter-spacing: 0.1em; color: var(--ink-soft); transition: opacity .6s;
  }
  .loading.gone { opacity: 0; pointer-events: none; }

  @media (max-width: 1100px) { .help { display: none; } }
  @media (max-width: 720px) {
    .title { padding: 8px 12px; }
    .title h1 { font-size: 22px; }
    .title p { display: none; }
    .side { width: 170px; padding: 8px 10px; gap: 7px; }
    .tool { width: 54px; font-size: 11.5px; }
    .tool kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div id="app">
  <canvas id="scene" tabindex="0" aria-label="建造场景"></canvas>
  <div class="tilt top"></div>
  <div class="tilt bottom"></div>
  <div class="sunglow" id="sunglow"></div>
  <div class="vignette"></div>

  <header class="card title">
    <h1>小小林间</h1>
    <p>Tiny Glade 风格建造 demo。没有网格，随手拖拽，城墙、房屋、小路和花树会自己长出细节。</p>
  </header>

  <aside class="card side">
    <label class="lab" for="tod"><span>时辰</span><b id="todName">午后</b></label>
    <input type="range" id="tod" min="0" max="1" step="0.001" value="0.7">
    <div class="lab"><span>天气</span><b id="wxName">晴</b></div>
    <div class="chips" id="wxChips"></div>
    <div class="lab"><span>季节</span><b id="seasonName">秋</b></div>
    <div class="chips" id="seasonChips"></div>
    <div class="btnrow">
      <button class="btn" id="undo" title="Ctrl+Z" aria-label="撤销">撤销</button>
      <button class="btn" id="clear">清空</button>
      <button class="btn" id="mute">声音：开</button>
    </div>
  </aside>

  <div class="help">
    左键拖拽：建造<br>
    右键拖拽：旋转视角<br>
    Shift+右键 / 中键：平移<br>
    滚轮：缩放　Ctrl+Z：撤销
  </div>

  <div class="dock">
    <div class="card options" id="options"></div>
    <nav class="card tools" id="tools" aria-label="建造工具"></nav>
  </div>

  <div class="card toast" id="toast" role="status"></div>
  <div class="loading" id="loading">正在铺草地……</div>
</div>

<script type="module">

// ================= 基础工具 =================

function polyLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z); return s; }

    const a = pts[seg], b = pts[seg + 1];

const canvas = document.getElementById('scene');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 700);
camera.position.set(36, 31, 40);

const controls = new OrbitControls(camera, canvas);

scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1d6', 2.8);

sun.shadow.mapSize.set(2048, 2048);

// 天空球：渐变 + 太阳光晕
const skyU = {

  sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: new THREE.Color() }, gnd: { value: new THREE.Color('#58703a') }

  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
  fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 bot; uniform vec3 sunCol; uniform vec3 sunDir; uniform vec3 gnd; varying vec3 vDir;
    void main(){

scene.add(sky);

const envScene = new THREE.Scene();

  if (envRT) envRT.dispose();

composer.addPass(bloom);

const CONE = new THREE.ConeGeometry(1, 1, 10);

const _p = new THREE.Vector3(), _s = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _m = new THREE.Matrix4();

// 把许多小零件合并成一个带顶点色的网格
class Builder {

  const Hh = 2.0, T = 0.78;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz);
    const mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2;

    const bl = new Builder();
    wallSegment(bl, len + 0.08, Hh, T, i % 2 === 0, Math.random() < 0.22);

  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], c = pts[i + 1], p = pts[i];
    const bl = new Builder();
    wallSegment(bl, T * 0.9, Hh, T - 0.05, false, false);
    const m = bl.mesh();

    dx = -v.z; dz = v.x; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l; len = 3.4;
    a = { x: a.x - dx * len / 2, z: a.z - dz * len / 2 };

  };

  clearNature(e);

  wpart(bd, '+z', 0, 0.45 + 0.6, 0.05, 0.72, 1.2, 0.06, jc('#7a5236'));

  for (const e of entities) {
    if (e.sway) { e.sway.rotation.z = Math.sin(perfT * 1.3 + e.ph) * 0.018; e.sway.rotation.x = Math.cos(perfT * 1.1 + e.ph) * 0.012; }
    for (const f of e.flags) { f.rotation.y = Math.sin(perfT * 2.6 + f.userData.ph) * 0.4; f.scale.x = 1 + Math.sin(perfT * 5 + f.userData.ph) * 0.08; }
    for (const c of e.chimneys) { c.t += dt; if (c.t > 0.55) { c.t = 0; spawnPuff(c.x + rand(-0.05, 0.05), c.y, c.z, { color: '#f2ede6', size: 0.32, life: 3.6, vy: 0.45, vx: 0.22, vz: 0.08, grow: 2.6, opacity: 0.45 }); } }
    if (e.sheep) updateSheep(e, dt);
    if (e.fish) updateFish(e, dt);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt; const k = p.t / p.life;
    if (k >= 1) { scene.remove(p.s); puffPool.push(p.s); puffs.splice(i, 1); continue; }
    p.s.position.x += p.vx * dt; p.s.position.y += p.vy * dt; p.s.position.z += p.vz * dt;
    p.s.scale.setScalar(p.size * (1 + p.grow * k));
    p.s.material.opacity = p.op * (1 - k) * Math.min(1, k * 6);
  }
  updateMotes(fireflies, perfT, 1.2);
  updateMotes(pollen, perfT * 0.5, 2.0);
  terrainU.uTime.value = perfT;
  if (envDirty && perfT - lastBake > 0.15) { bakeEnv(); lastBake = perfT; }
  sky.position.copy(camera.position);
  controls.update();
  // 阳光光晕：把太阳方向投到屏幕上，暖光从那一侧漫进来
  _p.copy(skyU.sunDir.value).multiplyScalar(200).add(camera.position).project(camera);
  if (_p.z < 1 && sunGlowK > 0.01) {
    sunGlowEl.style.opacity = sunGlowK.toFixed(3);
    sunGlowEl.style.setProperty('--sx', (clamp((_p.x + 1) / 2, -0.4, 1.4) * 100).toFixed(1) + '%');
    sunGlowEl.style.setProperty('--sy', (clamp((1 - _p.y) / 2, -0.4, 1.4) * 100).toFixed(1) + '%');
  } else sunGlowEl.style.opacity = '0';
  updateWeather(dt);
  composer.render();
  if (first) { first = false; document.getElementById('loading').classList.add('gone'); }
}
renderer.setAnimationLoop(() => frame());
seed();
renderSide();
applySeason();
</script>
</html>
